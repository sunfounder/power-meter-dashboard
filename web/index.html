<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<link rel="manifest" href="manifest.json">
<title>SunFounder 功率计</title>
<script src="vendor/echarts.min.js"></script>
<link rel="stylesheet" href="vendor/fontawesome.min.css">
<style>
:root{--bg:#080808;--card-bg:#141414;--border:#2a2a2a;--accent:#e27005;--text:#e0e0e0;--dim:#777;--red:#e04040;--green:#3cb84c;
--panel:#111;--panel2:#0c0c0c;--inner:#0a0a0a;--inner-bd:#222;--inner-bd2:#333;--border2:#1a1a1a;--grid:#555;--mark:#888;--btnbg:#444;--off:#333;--stopbg:#444}
body.theme-light{--bg:#f5f6f8;--card-bg:#ffffff;--border:#c9ccd4;--accent:#d85e00;--text:#1f2328;--dim:#7a8089;--red:#d43a3a;--green:#2e9e46;
--panel:#e4e7ec;--panel2:#eceef2;--inner:#f4f6f8;--inner-bd:#c3c8d1;--inner-bd2:#a4abb6;--border2:#dcdfe4;--grid:#a8aeba;--mark:#98a1ae;--btnbg:#d9dce2;--off:#c9cdd6;--stopbg:#c9cdd6}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:auto;margin:0}
body{font-family:system-ui,sans-serif;background:var(--bg);color:var(--text);overflow-y:auto}
body.locked .main-area{opacity:0.3;pointer-events:none}
.header{position:sticky;top:0;z-index:20;background:var(--panel2);padding:8px 16px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);width:100%;-webkit-app-region:drag}
.header button,.header .btn-icon,.header .conn-dot,.win-ctrl{-webkit-app-region:no-drag}
.header .title{font-size:16px;color:var(--accent);font-weight:700}
.header .right{display:flex;align-items:center;gap:10px}
.ambient{font-size:12px;color:var(--dim)}
.conn-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--green)}
.conn-dot.lost{background:var(--red)}
.btn-icon{background:none;border:1px solid var(--border);color:var(--text);font-size:14px;padding:3px 8px;border-radius:4px;cursor:pointer}
.btn-icon:hover{background:var(--inner-bd)}
.main-area{padding:8px;display:flex;flex-direction:column;gap:8px;width:100%;max-width:none}
.ch-row{background:var(--card-bg);border:1px solid var(--border);border-radius:8px;display:flex;flex-direction:column;overflow:hidden;padding:6px}
.ch-row.recording{border-color:var(--red)}
.ch-row.stopped{border-color:var(--accent)}
.ch-main{display:flex;gap:8px;align-items:stretch;flex:1;min-height:0}
.ch-metrics-box{display:flex;flex-direction:column;gap:4px;background:transparent;border:1px solid var(--border);border-radius:8px;padding:6px 8px;min-width:250px;flex:0 0 250px}
.ch-top{display:flex;align-items:center;gap:6px}
.ch-name{font-size:14px;font-weight:700;color:var(--accent)}
.ch-conn-bar{display:block;height:3px;background:var(--inner-bd2);border-radius:2px}
.ch-conn-bar.on{background:var(--accent)}
.ch-cards{display:grid;grid-template-columns:1fr 1fr;gap:2px}
.m-card{background:transparent;border:1px solid var(--inner-bd);border-radius:4px;display:flex;align-items:stretch;overflow:hidden;height:26px}
.m-value{flex:1;padding:3px 6px;font-size:12px;font-weight:700;font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.m-unit{padding:3px 7px;font-size:10px;font-weight:700;color:#fff;display:flex;align-items:center;min-width:28px;justify-content:center}
.ch-chart-box{background:var(--inner);border:1px solid var(--inner-bd);border-radius:8px;overflow:hidden;flex:1;min-width:0;min-height:160px}
.abs-toggle{display:flex;gap:4px}
.abs-toggle .toggle-btn{flex:1;font-size:12px;padding:2px 4px;height:26px;display:flex;align-items:center;justify-content:center}
.stop-title{color:var(--accent);font-weight:700;margin-bottom:2px}
.stop-master{font-size:12px;color:var(--accent);font-weight:700;display:flex;align-items:center;gap:4px}
.stop-panel .stop-head{display:flex;justify-content:space-between;align-items:center;height:26px;font-weight:700;color:var(--accent)}
.stop-panel .stop-item{display:flex;align-items:center;justify-content:space-between;gap:6px;height:26px;color:var(--text)}
.stop-panel .stop-item .stop-txt{display:flex;align-items:center;gap:6px}
.stop-panel .stop-item.off{opacity:0.35}
.stop-panel .stop-item input[type=number]{width:80px;border:1px solid var(--inner-bd);border-radius:3px;background:transparent;color:var(--text);font-size:13px;text-align:center;padding:2px 4px}
.stop-panel .stop-item input[type=number]:disabled{opacity:0.5}
.stop-panel.disabled .stop-item{opacity:0.35;pointer-events:none}
.data-bar-col{display:flex;flex-direction:column;gap:4px}
.rec-ctrl{display:flex;flex-direction:row;gap:4px;align-items:stretch}
.timer{font-weight:700;font-size:14px;background:transparent;border:1px solid var(--inner-bd);border-radius:4px;text-align:center;padding:2px 4px;height:26px;line-height:20px;flex:0 0 64px}
.rec-btns{display:flex;gap:4px;flex:1}
.rec-btns .btn-rec{flex:1}
.ch-chart-wrap{position:relative;flex:1;min-width:0;min-height:0;display:flex}
.chart-loading{position:absolute;inset:0;background:rgba(0,0,0,0.15);display:flex;align-items:center;justify-content:center;border-radius:8px;z-index:5}
.spinner{width:22px;height:22px;border:3px solid rgba(128,128,128,0.35);border-top-color:var(--accent);border-radius:50%;animation:spin 0.8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
/* switch-style checkbox */
.switch{position:relative;width:30px;height:16px;flex:0 0 30px;display:inline-block;cursor:pointer}
.switch input{opacity:0;width:0;height:0}
.switch .sl{position:absolute;cursor:pointer;inset:0;background:var(--inner-bd2);border-radius:8px;transition:0.2s}
.switch .sl:before{content:'';position:absolute;width:12px;height:12px;border-radius:50%;left:2px;top:2px;background:#fff;transition:0.2s}
.switch input:checked+.sl{background:var(--accent)}
.switch input:checked+.sl:before{transform:translateX(14px)}
.data-bar{display:flex;align-items:center;gap:6px;margin-top:6px;padding:4px 8px;background:var(--panel2);border-radius:6px;border:1px solid var(--border2);font-size:11px;flex-wrap:wrap}
.rec-name-group{display:flex;align-items:center;justify-content:space-between;gap:4px;background:transparent;border:1px solid var(--inner-bd);border-radius:4px;padding:3px 6px;height:26px}
.rec-name{color:var(--dim);font-size:14px;font-weight:700;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rec-name-input{flex:1;min-width:0;background:var(--inner);border:none;color:var(--text);font-size:11px;display:none}
.rec-name-group.editing .rec-name{display:none}
.rec-name-group.editing .rec-name-input{display:inline-block}
.rec-name-group.editing .btn-edit-rec{display:none}
.btn-edit-rec{background:none;border:none;color:var(--dim);cursor:pointer;font-size:11px;padding:1px 4px}
.btn-edit-rec:hover{color:var(--accent)}
.timer{font-weight:700;font-size:14px;background:transparent;border:1px solid var(--inner-bd);border-radius:4px;text-align:center;padding:2px 4px;height:26px;line-height:20px;flex:0 0 64px}
.file-info{display:flex;align-items:center;gap:4px;font-size:10px;color:var(--dim);background:var(--inner);border:1px solid var(--inner-bd);border-radius:4px;padding:2px 6px;height:22px;overflow:hidden}
.samples{color:var(--dim);font-size:10px}
.btn-rec{padding:4px;border:none;border-radius:4px;cursor:pointer;font-size:14px;font-weight:700;width:100%;height:26px}
.btn-rec.go{background:var(--green);color:#fff}
.btn-rec.stop{background:var(--red);color:#fff}
.btn-rec.dl{background:#1a4a8a;color:#fff}
.btn-rec.reset{background:var(--accent);color:#fff}
.btn-rec.sm{font-size:10px;padding:0 4px;height:26px;min-width:0}
.file-info{display:flex;align-items:center;gap:4px;font-size:10px;color:var(--dim)}
.file-info a{color:var(--accent);text-decoration:none}
.file-info button{background:none;border:none;color:var(--red);cursor:pointer;font-size:10px}
.btn-log{background:none;border:none;color:var(--dim);cursor:pointer;font-size:12px;padding:4px 6px;height:auto;display:flex;align-items:center;width:100%;margin-top:4px}
.btn-log .lg-arrow{font-size:15px;color:var(--dim);width:22px;text-align:left;transition:0.2s}
.btn-log .lg-txt{flex:1;text-align:left;color:var(--dim)}
.btn-log:hover .lg-txt,.btn-log:hover .lg-arrow{color:var(--accent)}
.btn-log:hover .lg-arrow{transform:translateY(1px)}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--accent);color:#fff;padding:8px 20px;border-radius:6px;font-size:13px;z-index:200;opacity:0;transition:opacity 0.3s}
.toast.show{opacity:1}
.conn-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:var(--bg);z-index:300}
.conn-overlay.hide{display:none}
.conn-close{position:absolute;top:12px;right:12px;background:none;border:none;color:var(--dim);font-size:20px;cursor:pointer;z-index:10}
.conn-close:hover{color:var(--red)}
.conn-box{position:absolute;top:0;left:0;right:0;bottom:0;background:var(--panel2);padding:200px 40px;text-align:center;display:flex;flex-direction:column;justify-content:center;align-items:center}
.conn-box h2{color:var(--accent);margin-bottom:8px}
.conn-box input{width:100%;padding:10px 14px;border:2px solid var(--border);border-radius:6px;background:var(--inner);color:var(--text);font-size:18px;text-align:center;font-family:monospace;margin-bottom:12px}
.conn-box .conn-btn{background:var(--accent);color:#fff;border:none;padding:10px 40px;border-radius:6px;cursor:pointer;font-size:15px;font-weight:700;width:100%}
.conn-box .conn-err{color:var(--red);font-size:11px}
.modal-overlay{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.75);z-index:100;justify-content:center;align-items:center}
.modal-overlay.show{display:flex}
.modal{background:var(--panel2);border:1px solid var(--border);border-radius:10px;padding:20px 24px;width:92%;max-width:480px;max-height:85vh;overflow-y:auto}
.modal h2{font-size:16px;color:var(--accent);margin-bottom:10px}
.modal .section{margin-bottom:10px}
.modal .section label{display:block;font-size:11px;color:var(--dim)}
.modal .section input:not([type=number]){padding:7px 10px;border:1px solid var(--border);border-radius:4px;background:var(--inner);color:var(--text);font-size:13px;width:100%}
.modal .section .row{display:flex;gap:8px}.modal .section .row input{flex:1}
.modal .section .row{display:flex;gap:8px}.modal .section .row input{flex:1}
.btn-buzz{background:var(--accent);color:#fff;border:none;padding:6px 14px;border-radius:4px;cursor:pointer;font-size:12px;font-weight:600}
.btn-buzz.upd-ready{background:var(--accent);color:#fff;font-weight:600;animation:pulse 1.2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.55}}
.btn-restart{background:#b32525;color:#fff;border:1px solid var(--red);padding:7px 18px;border-radius:4px;cursor:pointer;font-size:12px;font-weight:600;width:100%}
.toggle-group{display:flex;border-radius:4px;overflow:hidden}
.toggle-btn{flex:1;padding:6px 12px;border:none;cursor:pointer;font-size:12px;text-align:center;background:var(--border);color:var(--dim)}
.toggle-btn.active{background:var(--accent);color:#fff}
.toggle-btn:first-child{border-radius:4px 0 0 4px}
.toggle-btn:last-child{border-radius:0 4px 4px 0}
.toggle-btn+.toggle-btn{border-left:1px solid var(--border)}
.file-row{display:flex;align-items:center;gap:8px;padding:3px 0;font-size:12px}
.file-row .fname{flex:1;color:var(--text)}.file-row .fsize{color:var(--grid);font-size:10px}
.btn-dl{background:var(--accent);color:#fff;padding:3px 9px;border:none;border-radius:3px;cursor:pointer;font-size:10px;text-decoration:none}
.btn-del{background:var(--border);color:var(--red);padding:3px 7px;border:none;border-radius:3px;cursor:pointer;font-size:10px}
.pw-group{position:relative;display:flex;flex:1}
.pw-group input{flex:1;padding-right:30px}
.pw-group .pw-eye{position:absolute;right:0;top:0;bottom:0;width:28px;background:none;border:none;color:var(--dim);cursor:pointer;font-size:12px}
.data-scroll{max-height:200px;overflow-y:auto;display:none;margin-top:4px;background:var(--inner);border-radius:4px;padding:4px}
.data-table{width:100%;font-size:9px;border-collapse:collapse}
.data-table th{color:var(--dim);padding:2px 4px;text-align:center}
.data-table td{padding:1px 4px;color:var(--text);text-align:center}
.data-table tr{cursor:pointer}
.data-table tr:hover{background:var(--border2)}
.data-table tr.sel{background:#1a2f4a}
</style>
</head>
<body>
<div class="conn-overlay" id="connOverlay">
  <button class="conn-close" onclick="window.electron?.close()" title="关闭">✕</button>
  <div class="conn-box">
    <h2>连接设备</h2>
    <p style="color:var(--dim);font-size:12px;margin-bottom:16px">输入设备 IP 地址</p>
    <input id="connIP" placeholder="192.168.4.1" onkeydown="if(event.key==='Enter')doConnect()" autofocus>
    <div class="conn-err" id="connErr"></div>
    <button class="conn-btn" onclick="doConnect()">连接</button>
  </div>
</div>
<div class="header">
  <span class="title">SunFounder 功率计</span>
  <div class="right">
    <span class="ambient" id="ambTemp">--.-</span>
    <span class="ambient" id="pageTime" style="font-variant-numeric:tabular-nums">--:--:--</span>
    <span class="conn-dot lost" id="connDot"></span>
    <button class="btn-icon" onclick="openFiles()" title="文件"><i class="fa fa-folder"></i></button>
    <button class="btn-icon" onclick="openSettings()" title="设置"><i class="fa fa-gear"></i></button>
    <button class="btn-icon" onclick="toggleTheme()" id="btnTheme" title="主题"><i class="fa fa-moon"></i></button>
    <button class="btn-icon" onclick="toggleHideCh()" id="btnHideCh" title="显示未连接通道"><i class="fa fa-eye-slash"></i></button>
    <button class="btn-icon" onclick="refreshAll()" title="刷新"><i class="fa fa-rotate"></i></button>
    <button class="btn-icon" onclick="window.open('docs.html')" title="API 文档" style="color:var(--accent)"><i class="fa fa-circle-info"></i></button>
    <button class="btn-icon" onclick="if(window.electron)window.electron.devtools()" title="调试面板 (DevTools)"><i class="fa fa-bug"></i></button>
    <button class="btn-icon win-ctrl" onclick="window.electron?.min()" title="最小化" style="padding:3px 6px">_</button>
    <button class="btn-icon win-ctrl" onclick="window.electron?.max()" title="最大化" style="padding:3px 6px">□</button>
    <button class="btn-icon win-ctrl" onclick="window.electron?.close()" title="关闭" style="padding:3px 6px">✕</button>
  </div>
</div>
<div class="main-area" id="channelList"></div>
<div class="modal-overlay" id="settingsOverlay">
  <div class="modal">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px"><h2 style="margin:0">设置</h2><button class="btn-icon" onclick="closeModal('settingsOverlay')">X</button></div>
    <div class="section"><label>设备 IP</label><div class="row"><input type="text" id="setIP" readonly style="background:var(--inner);color:var(--dim)"><button class="btn-buzz" onclick="disconnect()" style="background:#b32525;color:#fff;border:1px solid var(--red)">断开</button></div></div>
    <div class="section"><label>设备名称</label><input type="text" id="setDevName" maxlength="24" onblur="saveSet('device_name',this.value)"></div>
    <div class="section"><label>AP 密码</label><div class="row"><div class="pw-group"><input type="password" id="setApPass" onblur="saveSet('ap_password',this.value)"><button class="pw-eye" onclick="togglePw('setApPass',this)"><i class="fa fa-eye"></i></button></div><button class="btn-buzz" onclick="saveSet('ap_password',document.getElementById('setApPass').value)">保存</button></div></div>
    <div class="section"><label>WiFi 连接</label><div class="row"><input type="text" id="setWifiSSID" placeholder="SSID"><div class="pw-group"><input type="password" id="setWifiPass" placeholder="Password"><button class="pw-eye" onclick="togglePw('setWifiPass',this)"><i class="fa fa-eye"></i></button></div><button class="btn-buzz" onclick="saveWiFi()">连接</button></div></div>
    <div class="section"><label>时区</label><select id="setTz" onchange="saveSet('tz_offset',this.value)" style="padding:7px 10px;border:1px solid var(--border);border-radius:4px;background:var(--inner);color:var(--text);font-size:13px;width:100%"><option value="-12">UTC-12</option><option value="-8">UTC-8 PST</option><option value="-5">UTC-5 EST</option><option value="0">UTC+0 GMT</option><option value="1">UTC+1 CET</option><option value="5">UTC+5</option><option value="8" selected>UTC+8 China</option><option value="9">UTC+9 Japan</option></select></div>
    <!-- rotation hidden until LVGL driver supports it -->
    <div class="section"><label>温度单位</label><div class="toggle-group"><button class="toggle-btn active" onclick="toggle2(this,'tuC','tuF');saveSet('temp_unit','C')" id="tuC">°C</button><button class="toggle-btn" onclick="toggle2(this,'tuF','tuC');saveSet('temp_unit','F')" id="tuF">°F</button></div></div>
    <div class="section"><label>环境温度校准</label><div class="row"><input type="number" id="calTemp" placeholder="实际温度" step="0.1" style="flex:1;padding:7px 10px;border:1px solid var(--border);border-radius:4px;background:var(--inner);color:var(--text);font-size:13px;-moz-appearance:textfield"><button class="btn-buzz" onclick="calibrateAmbTemp()">校准</button></div></div>
    <div class="section"><label>采样间隔</label><select id="setSampleMs" onchange="saveSet('sample_interval_ms',this.value)" style="padding:7px 10px;border:1px solid var(--border);border-radius:4px;background:var(--inner);color:var(--text);font-size:13px;width:100%"><option value="100">0.1s (10Hz)</option><option value="200">0.2s (5Hz)</option><option value="500">0.5s (2Hz)</option><option value="1000" selected>1s (1Hz)</option><option value="5000">5s</option><option value="10000">10s</option></select></div>
    <div class="section"><button class="btn-restart" onclick="if(confirm('确认重启?')){wsSend({type:'cmd',cmd:'restart'});}">重启</button>
    <button class="btn-buzz" onclick="checkUpdate()" id="btnUpdate" style="width:100%;margin-top:4px">检查更新</button>
    <button class="btn-buzz" onclick="saveLog()" id="btnSaveLog" style="width:100%;margin-top:4px;display:none">导出日志</button>
    <button class="btn-buzz" onclick="if(window.electron)window.electron.devtools()" style="width:100%;margin-top:4px">调试面板</button></div>
    <div style="text-align:center;font-size:12px;color:var(--dim);margin-top:8px;line-height:1.6" id="fwVer">固件版本: --</div>
    <div style="text-align:center;font-size:12px;color:var(--dim)"><span id="dashVer"></span></div>
  </div>
</div>
<div class="modal-overlay" id="filesOverlay">
  <div class="modal">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px"><h2 style="margin:0">文件</h2><div><button class="btn-icon" onclick="selectAllFiles()" title="全选"><i class="fa fa-check-double"></i></button><button class="btn-icon" onclick="delSelected()" title="删除选中" style="display:none" id="btnDelSel"><i class="fa fa-trash"></i></button><button class="btn-icon" onclick="closeModal('filesOverlay')">X</button></div></div>
    <div id="storageBar" style="margin-bottom:8px"></div>
    <div id="fileList" style="max-height:300px;overflow-y:auto">加载中...</div>
  </div>
</div>
<div class="toast" id="toast"></div>
<div class="modal-overlay" id="dlOverlay">
  <div class="modal" style="text-align:center">
    <h2 id="dlStatus">下载中...</h2>
    <div style="height:4px;background:var(--border2);border-radius:2px;margin:12px 0"><div id="dlBar" style="height:100%;width:0%;background:var(--accent);border-radius:2px;transition:width 0.3s"></div></div>
    <button class="btn-buzz" onclick="closeModal('dlOverlay')" id="dlCloseBtn" style="display:none">关闭</button>
  </div>
</div>
<script>
const DASH_VER='1.3.1'; // bump with each release
// theme: 'dark' | 'light'
let theme=localStorage.getItem('pm_theme')||'dark';
const TC=v=>getComputedStyle(document.documentElement).getPropertyValue('--'+v).trim();
function toggleTheme(){
  theme=theme==='dark'?'light':'dark';
  localStorage.setItem('pm_theme',theme);
  document.body.classList.toggle('theme-light',theme==='light');
  const b=document.getElementById('btnTheme');
  if(b)b.innerHTML=theme==='dark'?'<i class="fa fa-sun"></i>':'<i class="fa fa-moon"></i>';
  // re-render charts with new grid/mark colors
  for(let i=0;i<4;i++)if(charts[i])redrawChart(i);
}
// per-channel display mode: true = absolute values (default)
let absMode=[true,true,true,true];
try{const s=JSON.parse(localStorage.getItem('pm_abs')||'null');if(Array.isArray(s))absMode=s;}catch(_){}
const disp=(v,i)=>absMode[i]?Math.abs(v):v;
let hideDisconnected=localStorage.getItem('pm_hidech')!=='0';  // default: hide unconnected
let DEVICE='';
const C=['#e27005','#3cb84c','#4895ef','#e0c040'];
const MKEYS=['bus_voltage_V','current_mA','power_mW','channel_temp_C'];
let lastData=null,charts=[null,null,null,null],names=['CH1','CH2','CH3','CH4'],pfx=['test','test','test','test'];
let lastTs=0; // dedup
let recState=[0,0,0,0]; // 0=idle, 1=recording, 2=stopped
let recFiles=['','','',''];
let recStart=[0,0,0,0];

// No HTTP calls to device — everything goes over WebSocket (see wsReq/wsSend)
function getSavedIP(){return localStorage.getItem('pm_ip')||''}
function saveIP(ip){localStorage.setItem('pm_ip',ip)}

function setDevice(ip){
  DEVICE='http://'+ip;document.getElementById('setIP').value=ip;
  document.getElementById('connOverlay').classList.add('hide');
  document.body.classList.remove('locked');saveIP(ip);
  for(let i=0;i<4;i++){if(charts[i]){charts[i].dispose();charts[i]=null;}}
  build();
  connectWS(ip);
  // Firmware version + stop conditions sync happens in ws.onopen
}
// ── WebSocket primary data channel ──
let ws=null, wsTimer=null, wsRetry=0;
function connectWS(ip){
  if(ws)try{ws.close();}catch(_){}
  ws=new WebSocket('ws://'+ip+'/ws');
  ws.binaryType='arraybuffer';
  ws.onopen=()=>{
    console.log('[WS] connected to '+ip);
    document.getElementById('connDot').className='conn-dot';
    wsRetry=0;
    // Connection is live now — sync stop conditions + firmware version
    loadStopConds();
    wsReq({type:'cmd',cmd:'get_settings'}).then(d=>{
      if(d&&d.version)document.getElementById('fwVer').textContent='固件版本: '+d.version;
    }).catch(()=>{});
  };
  ws.onerror=e=>console.log('[WS] error',e.message||e.type);
  ws.onclose=e=>{
    console.log('[WS] closed code='+e.code+' reason='+e.reason);
    document.getElementById('connDot').className='conn-dot lost';
    if(++wsRetry<3){wsTimer=setTimeout(()=>{console.log('[WS] retry '+wsRetry);connectWS(ip);},3000);}
    else if(!document.getElementById('connOverlay').classList.contains('show')){
      console.log('[WS] giving up — show connect screen');
      document.body.classList.add('locked');
      document.getElementById('connOverlay').classList.remove('hide');
    }
  };
  ws.onmessage=e=>{
    if(e.data instanceof ArrayBuffer){
      // Binary frame: history stream chunk or .dat download chunk
      if(streamActive){
        streamChunks.push(new Uint8Array(e.data));
        appendStreamChunk(e.data);
        // reset stall watchdog on every chunk
        if(streamWatch){clearTimeout(streamWatch);streamWatch=null;}
        streamWatch=setTimeout(()=>{
          streamWatch=null;
          if(streamActive){
            if(++streamStall<=3){
              const ci2=streamChan;
              console.log('[STREAM] stalled 3s — resume from '+streamGot[ci2]+' (#'+streamStall+')');
              streamActive=false;streamChan=-1;
              const resumeAt=streamGot[ci2]||0;
              setTimeout(()=>loadBufferData(ci2,resumeAt),500*streamStall);  // backoff + resume
            }else{
              streamActive=false;streamChan=-1;
              toast('历史数据加载中断，请刷新重试');
              console.log('[STREAM] gave up after '+streamStall+' restarts');
            }
          }
        },3000);
      }
      else if(dlActive){dlChunks.push(new Uint8Array(e.data));}
      return;
    }
    let msg;try{msg=JSON.parse(e.data);}catch(_){console.log('[WS] BAD JSON frame len='+e.data.length+' head='+String(e.data).slice(0,80));return;}
    if(msg.type==='measurement'){
      const chs=msg.data&&msg.data.channels?msg.data.channels:[];
      const rec=msg.data&&msg.data.recording?msg.data.recording.map(r=>r&&r.active?'R':'-').join(''):'?';
      console.log('[WS] m ch='+chs.map(c=>c&&c.connected?'1':'0').join('')+' rec='+rec);
    }
    else if(msg.type==='ack')console.log('[WS] ack',msg.cmd,msg.ok);
    else if(msg.type==='stream_done')console.log('[STREAM] done total='+msg.total);
    else if(msg.type==='dl_done'||msg.type==='dl_fail')console.log('[WS]',msg.type);
    if(msg.type==='stream_done'){
      console.log('[STREAM] done total='+msg.total);
      // Flush any remaining queued samples immediately (skip slow-draw pacing)
      const fi=streamChan;
      if(fi>=0&&histQueue[fi]&&histQueue[fi].length&&charts[fi]){
        if(!histData[fi])histData[fi]=[[],[],[],[]];
        for(const s of histQueue[fi]){
          for(let m=0;m<4;m++)histData[fi][m].push([s.ts,disp(s.vals[m],fi)]);
        }
        histQueue[fi]=[];
        const opts={series:[]};
        for(let m=0;m<4;m++)opts.series.push({data:histData[fi][m]});
        charts[fi].setOption(opts,{notMerge:false});
      }
      // Live chart continues from the end of history: release fixed X max
      if(fi>=0&&charts[fi])charts[fi].setOption({xAxis:{max:null}},{notMerge:false});
      if(fi>=0)sampleCount[fi]=0;
      // Assemble the detail-table data store from all received chunks
      const i=streamChan;
      const total=streamChunks.reduce((n,c)=>n+c.length,0);
      if(i>=0&&total){
        const u8=new Uint8Array(total);let off=0;
        for(const c of streamChunks){u8.set(c,off);off+=c.length;}
        const v=new DataView(u8.buffer);
        const fmtClock=ts=>{const d=new Date(ts*1000);return ('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2)+':'+('0'+d.getSeconds()).slice(-2);};
        dataStore[i]=[];
        for(let o=0;o+24<=total;o+=24){
          const ts=v.getUint32(o,true);
          dataStore[i].push({t:fmtClock(ts),V:v.getFloat32(o+4,true),A:v.getFloat32(o+8,true),
                             W:v.getFloat32(o+12,true),C:v.getFloat32(o+16,true)});
        }
        if(typeof updateTables==='function')updateTables();
      }
      streamActive=false;streamChan=-1;streamChunks=[];streamStall=0;
      if(streamWatch){clearTimeout(streamWatch);streamWatch=null;}
      window.dispatchEvent(new Event('stream-done'));
      return;
    }
    if(msg.type==='dl_done'){window.dispatchEvent(new Event('dl-done'));return;}
    if(msg.type==='dl_fail'){window.dispatchEvent(new CustomEvent('dl-fail',{detail:msg.error}));return;}
    if(msg.type==='ack'&&msg.req_id&&wsPending[msg.req_id]){
      const p=wsPending[msg.req_id];delete wsPending[msg.req_id];
      p.res(msg);return;
    }
    if(msg.type==='measurement'){processData(msg.data);}
    else if(msg.type==='alarm')toast(msg.message);
  };
}
function doConnect(){
  const ip=document.getElementById('connIP').value.trim();
  if(!ip){document.getElementById('connErr').textContent='输入 IP';return;}
  // Straight to WebSocket — WS onopen/onclose determines connection state
  document.getElementById('connErr').textContent='连接中...';
  setDevice(ip);
}
function disconnect(){
  if(wsTimer)clearTimeout(wsTimer);
  if(ws)try{ws.close();}catch(_){}
  ws=null;
  document.body.classList.add('locked');
  document.getElementById('connDot').className='conn-dot lost';
  document.getElementById('connOverlay').classList.remove('hide');
  document.getElementById('connIP').value=getSavedIP();
  document.getElementById('connIP').focus();
  document.getElementById('channelList').innerHTML='';
}

function saveStop(i){
  const en=document.getElementById('se'+i).checked?'1':'0';
  const vOn=document.getElementById('sev'+i).checked;
  const mAOn=document.getElementById('sem'+i).checked;
  const minOn=document.getElementById('sed'+i).checked;
  const v=vOn?document.getElementById('sv'+i).value:'0';
  const a=mAOn?parseFloat(document.getElementById('sm'+i).value):0;
  const h=minOn?parseFloat(document.getElementById('sd'+i).value):0;
  const fall=document.getElementById('sf'+i).checked?'1':'0';
  // disable inputs of off items
  ['sv'+i,'sm'+i,'sd'+i].forEach(id=>{const el=document.getElementById(id);if(el)el.disabled=!en;});
  document.getElementById('siv'+i).classList.toggle('off',!vOn);
  document.getElementById('sim'+i).classList.toggle('off',!mAOn);
  document.getElementById('sid'+i).classList.toggle('off',!minOn);
  wsSend({type:'cmd',cmd:'settings',stop_ch:i,stop_en:en,stop_v:v,stop_mA:(a*1000).toFixed(0),stop_min:Math.round(h*60),stop_fall:fall});
  toast('自动停止条件已保存 (CH'+(i+1)+')');
  applyStopUI(i);
}

function applyStopUI(i){
  const en=document.getElementById('se'+i).checked;
  const off=!en;
  const panel=document.getElementById('sp'+i);
  if(panel)panel.classList.toggle('disabled',off);
  ['siv','sim','sid'].forEach(p=>{
    const el=document.getElementById(p+i);
    if(el){el.style.opacity=off?'0.35':'1';el.style.pointerEvents=off?'none':'auto';}
  });
  ['sv','sm','sd','sev','sem','sed','sf'].forEach(id=>{
    const el=document.getElementById(id+i);
    if(el)el.disabled=off;
  });
}
function loadStopConds(){
  wsReq({type:'cmd',cmd:'get_settings'}).then(d=>{
    if(!d||!d.stop_cond)return;
    for(let i=0;i<4;i++){
      const sc=d.stop_cond[i];if(!sc)continue;
      const se=document.getElementById('se'+i);
      if(se)se.checked=!!sc.en;
      const setItem=(sid,cid,val,dispVal)=>{
        const s=document.getElementById(sid),c=document.getElementById(cid);
        if(c)c.checked=val>0;
        if(s)s.classList.toggle('off',!(val>0));
        const inp=document.getElementById(cid==='sev'+i?'sv'+i:cid==='sem'+i?'sm'+i:'sd'+i);
        if(inp){inp.value=dispVal;inp.disabled=!(val>0);}
      };
      setItem('siv'+i,'sev'+i,sc.v||0,(sc.v||0.5));
      setItem('sim'+i,'sem'+i,sc.mA||0,((sc.mA||10)/1000).toFixed(3));
      setItem('sid'+i,'sed'+i,sc.min||0,(sc.min/60)||8);
      document.getElementById('sf'+i).checked=!!sc.fall;
      applyStopUI(i);
    }
  });
}

// Process one measurement payload (from WebSocket)
function processData(d){
    if(!d)return;
    lastData=d;document.getElementById('connDot').className='conn-dot';
    if(d.temp_unit){tempUnit=d.temp_unit;}
    // Live WiFi status: update settings box + follow IP drift after reconnect
    if(d.wifi_ip){
      const ipInput=document.getElementById('setIP');
      if(ipInput)ipInput.value=d.wifi_ip;
      if(!DEVICE.includes(d.wifi_ip)&&!d.wifi_ip.startsWith('0.')){
        // Device got a new IP after reconnect — follow it
        DEVICE='http://'+d.wifi_ip;
        localStorage.setItem('pm_ip',d.wifi_ip);
      }
      const ssidInput=document.getElementById('setWifiSSID');
      if(ssidInput&&d.wifi_ssid)ssidInput.value=d.wifi_ssid;
    }
    // Highlight scope channel
    for(let i=0;i<4;i++){
      const cr=document.getElementById('cr'+i);
      if(cr)cr.style.borderColor=d.scope_ch>=0&&d.scope_ch==i?'#e27005':'';
    }

    // Recover recording state after page refresh
    if(d.recording)for(let i=0;i<4;i++){
      const r=d.recording[i];if(!r)continue;
      if(r.active && recState[i]===0){
        recState[i]=1;
        sampleCount[i]=r.samples||0;
        document.getElementById('cr'+i).classList.add('recording');
        setRecBtns(i,1);
        document.getElementById('rn'+i).textContent=r.name||pfx[i];
        // Wait for chart to be ready, then load buffer data
        const chIdx=i;
        const tryLoad=()=>{if(charts[chIdx])loadBufferData(chIdx);else setTimeout(tryLoad,200);};
        setTimeout(tryLoad,500);
      }
      // Device stopped recording (auto-stop or external) while APP thought it was recording
      if(!r.active && recState[i]===1 && Date.now()-recStart[i]>3000){
        recState[i]=2;
        document.getElementById('cr'+i).classList.remove('recording');
        document.getElementById('cr'+i).classList.add('stopped');
        if(r.last_file)recFiles[i]=r.last_file;
        setRecBtns(i,2);
        toast('CH'+(i+1)+' 录制已停止');
        loadFiles();
      }
      // Refresh while stopped: recover stopped state from device
      if(!r.active && recState[i]===0 && r.last_file && !clearedFile[i]){
        recState[i]=2;
        document.getElementById('cr'+i).classList.add('stopped');
        recFiles[i]=r.last_file||'';
        setRecBtns(i,2);
        // Load recorded data into chart
        const chIdx=i;
        const tryLoad=()=>{if(charts[chIdx])loadBufferData(chIdx);else setTimeout(tryLoad,200);};
        setTimeout(tryLoad,500);
      }
    }
    up();uc();updateTables();
}

function updateTables(){
  for(let i=0;i<4;i++){
    const tb=document.getElementById('dtb'+i);if(!tb)continue;
    const d=dataStore[i];if(!d.length)continue;
    const cnt=document.getElementById('lgn'+i);
    if(cnt)cnt.textContent=d.length+' 行';
    tb.innerHTML=d.map((r,j)=>

function up(){
  if(!lastData)return;
  const d=lastData,chs=d.channels;
  // Ambient temp: WS broadcast nests it under env, HTTP status has it top-level
  const amb=(d.env&&d.env.ambient_temp_C!=null)?d.env.ambient_temp_C:d.ambient_temp_C;
  document.getElementById('ambTemp').textContent=(amb==null||amb<-100)?'---':convTemp(amb).toFixed(1)+' '+ut();
  if(d.timestamp){
    const dt=new Date(d.timestamp*1000);
    document.getElementById('pageTime').textContent=
      ('0'+dt.getHours()).slice(-2)+':'+('0'+dt.getMinutes()).slice(-2)+':'+('0'+dt.getSeconds()).slice(-2);
  }

  for(let i=0;i<4;i++){
    const ch=chs[i];if(!ch)continue;const ok=ch.connected;
    const row=document.getElementById('cr'+i);
    if(row)row.style.display=(hideDisconnected&&!ok)?'none':'';
    for(let j=0;j<4;j++){
      const el=document.getElementById('cv'+i+'_'+j);if(!el)continue;
      if(!ok){el.textContent='---';el.className='m-value dim';continue;}
      let raw=ch[MKEYS[j]];if(raw==null||isNaN(raw))raw=0;
      if(j===3&&raw<-100){el.textContent='---';el.className='m-value dim';continue;}
      if(j===3)raw=convTemp(raw);
      el.textContent=(['V','A','W','C'][j]==='V'?raw.toFixed(2):['A','W'].includes(['V','A','W','C'][j])?disp(raw/1000,i).toFixed(3):raw.toFixed(1));
      el.className='m-value';
    }
    // keep channel names as CH1-CH4, don't sync from server
    document.getElementById('cc'+i).className='ch-conn-bar'+(ok?' on':'');
    for(let j=0;j<4;j++){const u=document.getElementById('cu'+i+'_'+j);if(u)u.style.background=serHidden[i][j]?'var(--off)':(ok?C[j]:'var(--off)');}
    // Update temperature unit label
    const tu=document.getElementById('cu'+i+'_3');if(tu)tu.textContent=ut();
    const btn=document.getElementById('cb'+i);
    if(btn&&recState[i]===0){if(!ok){btn.disabled=true;btn.style.opacity='0.35'}else{btn.disabled=false;btn.style.opacity=''}}
  }

  if(d.recording)for(let i=0;i<4;i++){
    const r=d.recording[i];if(!r||!r.active)continue;
    if(recState[i]!==1)continue;
    document.getElementById('ct'+i).textContent=r.elapsed||'00:00';
    const ch=chs[i];
    if(ch&&ch.connected){
      const fmtClock=ts=>{const d=new Date((ts||0)*1000);return ('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2)+':'+('0'+d.getSeconds()).slice(-2);};
      dataStore[i].push({t:fmtClock(d.timestamp),V:ch.bus_voltage_V,A:ch.current_mA/1000,W:(ch.power_mW||0)/1000,C:ch.channel_temp_C});
    }
  }
}

function uc(){
  if(!lastData)return;
  for(let i=0;i<4;i++){
    try{
      // While the history stream fills this channel's chart, skip live push
      if(streamActive&&streamChan===i)continue;
      const ch=lastData.channels[i];if(!ch||!ch.connected)continue;
      const c=charts[i];if(!c){console.log('[UC] ch'+i+' chart null');continue;}
      if(recState[i]!==1)continue;
      const raw=[ch.bus_voltage_V,ch.current_mA/1000,(ch.power_mW||0)/1000,ch.channel_temp_C];
      const pts=[];
      for(let m=0;m<4;m++){
        let v=raw[m];
        if(v===0||v===null||isNaN(v))v=lastNZ[i][m];else lastNZ[i][m]=v;
        pts.push(v||0);
      }
      const idx=lastData.timestamp||sampleCount[i]++;  // real epoch seconds
      const opts={series:[]};
      for(let m=0;m<4;m++){
        const data=[...c.getOption().series[m].data];
        data.push([idx,disp(pts[m],i)]);
        opts.series.push({data});
      }
      c.setOption(opts,{notMerge:false});
    }catch(e){console.log('[UC] ch'+i+' err:',e.message);}
  }
}

// Send a command over WebSocket (primary control channel)
function wsSend(obj){
  if(ws&&ws.readyState===1){ws.send(JSON.stringify(obj));return true;}
  return false;
}
// Promise-style WS request: {type:'cmd',cmd:...} → resolves with ack payload
let wsReqId=0, wsPending={};
function wsReq(obj,timeout){
  return new Promise((res,rej)=>{
    if(!ws||ws.readyState!==1){rej(new Error('ws closed'));return;}
    const id=++wsReqId;
    wsPending[id]={res,rej};
    ws.send(JSON.stringify({...obj,req_id:id}));
    setTimeout(()=>{if(wsPending[id]){delete wsPending[id];rej(new Error('ws timeout'));}},timeout||8000);
  });
}
function setRecBtns(i,state){
  // state: 0=REC, 1=STOP, 2=Reset+DL
  const ctrl=document.getElementById('rc'+i);
  if(!ctrl)return;
  if(state===0)ctrl.innerHTML='<button class="btn-rec go" id="cb'+i+'" onclick="tr('+i+')">录制</button>';
  else if(state===1)ctrl.innerHTML='<button class="btn-rec stop" id="cb'+i+'" onclick="tr('+i+')">停止</button>';
  else ctrl.innerHTML='<button class="btn-rec reset sm" onclick="resetCh('+i+')">重置</button><button class="btn-rec dl sm" onclick="downloadCSVFile(\''+(recFiles[i]||'')+'\')">下载</button>';
}

  recFiles[i]='';
  if(charts[i])charts[i].setOption({series:[{data:[]},{data:[]},{data:[]},{data:[]}]});
  setRecBtns(i,0);

function tr(i){
  if(!lastData||!lastData.channels[i].connected){toast('CH'+(i+1)+' offline');return;}

  if(recState[i]===0){ // IDLE → START RECORDING
    recState[i]=1;recStart[i]=Date.now();sampleCount[i]=0;clearedFile[i]=false;
    document.getElementById('cr'+i).classList.add('recording');
    document.getElementById('cr'+i).classList.remove('stopped');
    setRecBtns(i,1);
    dataStore[i]=[];
    document.getElementById('dts'+i).style.display='none';
    // Clear chart
    if(charts[i]){
      charts[i].setOption({series:[{data:[]},{data:[]},{data:[]},{data:[]}]});
      lastNZ[i]=[0,0,0,0];
    }
    document.getElementById('rn'+i).textContent=pfx[i];
    wsSend({type:'cmd',cmd:'record_start',ch:i,name:pfx[i]});
  }
  else if(recState[i]===1){ // RECORDING → STOP
    if(!confirm('确定停止录制 CH'+(i+1)+'?'))return;
    recState[i]=2;
    document.getElementById('cr'+i).classList.remove('recording');
    document.getElementById('cr'+i).classList.add('stopped');
    setRecBtns(i,2);  // Reset + DL (recFiles filled below)
    wsSend({type:'cmd',cmd:'record_stop',ch:i});
    // Fetch file list to find the newly created file
    wsReq({type:'cmd',cmd:'files'}).then(d=>{
      const fl=d&&d.data?d.data:[];
      if(fl.length){
        const latest=fl[fl.length-1]; // assume last file is ours
        recFiles[i]=latest.name||'';
        setRecBtns(i,2);  // refresh DL button with actual filename
      }
    });
  }
  else if(recState[i]===2){ // STOPPED → RESET
    resetCh(i);
  }
}

// ── Update state machine ──
// idle → downloading (background) → ready (pending) → applying → restart
let updState = { phase: 'idle', ver: '', url: '', pct: 0 };

function updBtn(txt, cls) {
  const b = document.getElementById('btnUpdate');
  if (!b) return;
  b.textContent = txt;
  b.className = 'btn-buzz' + (cls ? ' ' + cls : '');
}
function verCmp(a,b){
  const pa=String(a).split('.').map(Number),pb=String(b).split('.').map(Number);
  for(let i=0;i<Math.max(pa.length,pb.length);i++){
    const x=pa[i]||0,y=pb[i]||0;
    if(x>y)return 1;if(x<y)return -1;
  }
  return 0;
}
function updBtnInit() {
  // Resume pending state from last session
  try {
    const p = JSON.parse(localStorage.getItem('pm_pending') || 'null');
    if (p && p.v) {
      if (verCmp(p.v, DASH_VER) > 0) {
        // pending is newer than current build → offer update
        updState.phase = 'ready'; updState.ver = p.v;
        updBtn('立即更新 v' + p.v, 'upd-ready');
      } else {
        // already at/above pending version → stale download, discard
        localStorage.removeItem('pm_pending');
      }
    }
  } catch (_) {}
}

function checkUpdate() {
  if (updState.phase === 'downloading') return;
  if (updState.phase === 'ready') { applyUpdate(); return; }
  if (updState.phase === 'applying') return;
  const b = document.getElementById('btnUpdate');
  const old = b ? b.textContent : '';
  updBtn('检查中...');
  fetch('https://api.github.com/repos/sunfounder/power-meter-dashboard/releases/latest')
  .then(r => r.json()).then(rel => {
    if (!rel || !rel.tag_name) { updBtn(old || '检查更新'); toast('检查失败'); return; }
    const remoteVer = String(rel.tag_name).replace(/^v/, '');
    if (verCmp(remoteVer, DASH_VER) <= 0) { updBtn('检查更新'); toast('已是最新 v' + DASH_VER); return; }
    const zip = (rel.assets || []).find(a => a.name.endsWith('.zip'));
    if (window.electron && zip) {
      // Background download; progress shown on the button itself
      updState.phase = 'downloading'; updState.ver = remoteVer; updState.url = zip.browser_download_url;
      updState.changelog = rel.body || '';
      updBtn('下载中 0%...');
      toast('发现新版本 v' + remoteVer + '，后台下载中，可继续操作');
      window.electron.downloadUpdate(zip.browser_download_url).then(r => {
        if (r && r.ok) {
          updState.phase = 'ready';
          updBtn('立即更新 v' + remoteVer, 'upd-ready');
          localStorage.setItem('pm_pending', JSON.stringify({ v: remoteVer, ts: Date.now() }));
          toast('更新已下载，点击「立即更新」安装');
        } else {
          updState.phase = 'idle';
          updBtn('检查更新');
          toast('下载失败: ' + (r && r.error || '未知错误'));
        }
      });
    } else {
      // Browser mode: open release page
      const url = zip ? zip.browser_download_url : rel.html_url;
      if (confirm('发现新版本 v' + remoteVer + ' (当前 v' + DASH_VER + ')\n\n更新内容:\n' + (rel.body || '') + '\n\n打开下载页面?')) {
        window.open(url, '_blank');
      }
      updBtn('检查更新');
    }
  }).catch(() => { updBtn(old || '检查更新'); toast('检查失败(需联网)'); });
}

function applyUpdate() {
  if (updState.phase !== 'ready') return;
  if (!confirm('应用更新到 v' + updState.ver + '?\n应用将自动关闭并重启为新版本。')) return;
  updState.phase = 'applying';
  updBtn('正在安装...');
  // Remember for next launch: show "updated" toast with changelog
  try {
    localStorage.setItem('pm_just_updated', JSON.stringify({ v: updState.ver, changelog: updState.changelog || '', ts: Date.now() }));
  } catch (_) {}
  window.electron.applyUpdate().then(r => {
    if (r && !r.ok) {
      updState.phase = 'ready';
      updBtn('立即更新 v' + updState.ver, 'upd-ready');
      toast('安装失败: ' + (r.error || ''));
    }
    // on success the app quits; nothing more to do
  });
}

// ── Download .dat → convert to CSV client-side (over WebSocket binary) ──
window.addEventListener('resize',()=>{setTimeout(()=>charts.forEach(c=>c?.resize()),100);});
// History stream state (binary chunks from device until stream_done)
let streamActive=false, streamChunks=[], streamChan=-1, streamWatch=null, streamStall=0;
let streamGot=[0,0,0,0];  // samples received per channel (for resume)
let dlChunks=[], dlActive=false;
async function downloadCSVFile(fname){
  if(dlActive){toast('已有下载进行中');return;}
  if(!ws||ws.readyState!==1){toast('未连接');return;}
  dlActive=true;dlChunks=[];
  toast('下载中...');
  ws.send(JSON.stringify({type:'cmd',cmd:'download_start',file:fname}));
  // Data arrives as binary frames; dl_done JSON frame signals completion
  await new Promise((res,rej)=>{
    const t=setTimeout(()=>{cleanup();rej(new Error('timeout'));},30000);
    function cleanup(){
      clearTimeout(t);
      window.removeEventListener('dl-done',onDone);
      window.removeEventListener('dl-fail',onFail);
      dlActive=false;
    }
    function onDone(){cleanup();res();}
    function onFail(e){cleanup();rej(new Error(e.detail||'fail'));}
    window.addEventListener('dl-done',onDone);
    window.addEventListener('dl-fail',onFail);
  }).catch(()=>{toast('下载失败');return;});
  const total=dlChunks.reduce((n,c)=>n+c.length,0);
  if(!total){toast('下载失败(空)');return;}
  const u8=new Uint8Array(total);
  let off=0;
  for(const c of dlChunks){u8.set(c,off);off+=c.length;}
  const v=new DataView(u8.buffer);
  let csv='\ufefftimestamp_s,Voltage_V,Current_A,Power_W,Temp_C,Ambient_TempC\n';
  for(let o=0;o+24<=total;o+=24){
    csv+=[v.getUint32(o,true),v.getFloat32(o+4,true).toFixed(3),v.getFloat32(o+8,true).toFixed(3),
      v.getFloat32(o+12,true).toFixed(3),v.getFloat32(o+16,true).toFixed(1),v.getFloat32(o+20,true).toFixed(1)].join(',')+'\n';
  }
  toast('转换完成，请选择保存位置');
  const blob=new Blob([csv],{type:'text/csv'});const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);a.download=fname.replace('.dat','.csv');a.click();
  URL.revokeObjectURL(a.href);
}

// ── Start history stream: chunks are appended to the chart as they arrive ──
async function loadBufferData(i, offset){
  if(streamActive){console.log('[HIST] ch'+i+' stream already active');return;}
  streamChunks=[];streamActive=true;streamChan=i;
  streamGot[i]=offset||0;
  try{
    const ack=await wsReq({type:'cmd',cmd:'stream_start',ch:i,offset:streamGot[i]},5000);
    if(!ack||!ack.ok){streamActive=false;streamChan=-1;console.log('[HIST] ch'+i+' stream_start failed (no file?)');return;}
    // X axis starts at the recording start time (skip if NTP wasn't synced)
    if(ack.start_ts>1000000000){
      setTimeout(()=>{const c=charts[i];if(c)c.setOption({xAxis:{min:ack.start_ts}},{notMerge:false});},50);
    }
    setTimeout(()=>{if(charts[i])charts[i].resize();},50);  // canvas size before appending
  }catch(e){
    streamActive=false;streamChan=-1;
    console.log('[HIST] ch'+i+' stream_start error:',e.message);
  }
  // No spinner: chart fills progressively via appendStreamChunk()
}

// History series data kept client-side; redraw in batches (appendData proved
// unreliable in this Electron/echarts combination)
let histData=[null,null,null,null];
let histQueue=[null,null,null,null];  // parsed samples awaiting slow-draw
let firstTs=[0,0,0,0];    // first sample epoch per channel (X axis min)
const HIST_PER_FRAME=4;   // samples per channel per frame (~4pts/16ms ≈ 250 pts/s)

// Slow-draw loop (rAF, frame-synced): queue fills fast from WS, chart grows smoothly
function histLoop(){
  for(let i=0;i<4;i++){
    const q=histQueue[i];
    if(!q||!q.length)continue;
    const c=charts[i];if(!c)continue;
    const batch=q.splice(0,HIST_PER_FRAME);
    if(!histData[i])histData[i]=[[],[],[],[]];
    for(const s of batch){
      for(let m=0;m<4;m++)histData[i][m].push([s.ts,disp(s.vals[m],i)]);
    }
    const opts={series:[]};
    for(let m=0;m<4;m++)opts.series.push({data:histData[i][m]});
    c.setOption(opts,{notMerge:false});
  }
  requestAnimationFrame(histLoop);
}
requestAnimationFrame(histLoop);

// Append one binary chunk to the queue (slow-draw loop renders it)
function appendStreamChunk(buf){
  try{
    const i=streamChan;if(i<0)return;
    const u8=new Uint8Array(buf);
    const v=new DataView(u8.buffer);
    const n=Math.floor(u8.byteLength/24);
    if(!n)return;
    streamGot[i]+=n;
    if(!histQueue[i])histQueue[i]=[];
    for(let o=0;o<n;o++){
      const b=o*24;
      const ts=v.getUint32(b,true);  // real epoch seconds
      // First sample → pin X axis (start ~ now) and mark the latest value
      if(firstTs[i]===0&&ts>1000000000){
        firstTs[i]=ts;
        const nowTs=Math.floor(Date.now()/1000);
        const ch=lastData&&lastData.channels[i];
        setTimeout(()=>{
          const c=charts[i];if(!c)return;
          const opt={xAxis:{min:ts,max:Math.max(nowTs,ts+1)}};
          if(ch&&ch.connected){
            const ys=[ch.bus_voltage_V,ch.current_mA/1000,(ch.power_mW||0)/1000,ch.channel_temp_C];
            opt.series=[0,1,2,3].map(m=>({markPoint:{symbol:'circle',symbolSize:6,
              itemStyle:{color:C[m]},label:{show:false},data:[{coord:[nowTs,disp(ys[m],i)]}]}}));
          }
          c.setOption(opt,{notMerge:false});
        },0);
      }
      histQueue[i].push({ts,vals:[v.getFloat32(b+4,true),v.getFloat32(b+8,true),v.getFloat32(b+12,true),v.getFloat32(b+16,true)]});
    }
  }catch(e){console.log('[HIST] append err:',e.message);}
}
