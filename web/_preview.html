<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>markArea 效果预览</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
<style>
body{background:#0c0c0c;margin:0;padding:16px;font-family:system-ui,sans-serif}
.ch{background:#141414;border:1px solid #2a2a2a;border-radius:8px;height:220px;margin-bottom:12px}
h3{color:#e27005;margin:8px 2px;font-size:14px}
</style>
</head>
<body>
<h3>CH1 — 模拟充电（正功率逐渐减小）</h3>
<div class="ch" id="c1"></div>
<h3>CH2 — 模拟放电/反向（负电流）</h3>
<div class="ch" id="c2"></div>
<script>
const C=['#e27005','#3cb84c','#4895ef','#e6c800'];
function mk(id, seriesData){
  const c=echarts.init(document.getElementById(id));
  c.setOption({
    backgroundColor:'#141414',
    grid:{left:12,right:12,top:8,bottom:22},
    tooltip:{trigger:'axis',confine:true},
    xAxis:{type:'value',min:0,axisLabel:{color:'#666',fontSize:9}},
    yAxis:{type:'value',axisLabel:{show:false},splitLine:{lineStyle:{color:'#222'}}},
    dataZoom:[{type:'inside'}],
    series:seriesData.map((s,i)=>({
      name:['V','A','W'][i],type:'line',yAxisIndex:0,
      data:s,color:C[i],lineStyle:{color:C[i],width:1.5},symbol:'none',
      markArea:{silent:true,label:{show:false},data:[[
        {yAxis:0,itemStyle:{color:'rgba(60,180,76,0.07)'}},{yAxis:'max'}
      ],[
        {yAxis:'min',itemStyle:{color:'rgba(240,90,90,0.07)'}},{yAxis:0}
      ]]},
      markLine:{symbol:'none',silent:true,lineStyle:{color:'#888',type:'dashed',width:1},data:[{yAxis:0}],label:{show:false}}
    }))
  });
}
// CH1: 充电 5W -> 1W（正，向下）
const t1=Array.from({length:120},(_,j)=>j);
mk('c1',[
  t1.map(j=>[j,5.0]),
  t1.map(j=>[j,1.0]),
  t1.map(j=>[j,5-j/30])
]);
// CH2: 放电 -1A -> -4A（负，向下加深）
const t2=Array.from({length:120},(_,j)=>j);
mk('c2',[
  t2.map(j=>[j,3.0]),
  t2.map(j=>[j,-(1+j/40)]),
  t2.map(j=>[j,-(3+j/40)])
]);
</script>
</body>
</html>
