[platformio]
src_dir = src
boards_dir = ./boards
build_dir = C:/tmp/pio-build-4chpm

[env:4ch-power-meter]
platform = espressif32@6.0.1
board = lilygo-t-displays3
framework = arduino
debug_tool = esp-builtin
upload_protocol = esptool
upload_port = COM16
monitor_speed = 115200
build_flags = 
    -DLV_LVGL_H_INCLUDE_SIMPLE
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DDISABLE_ALL_LIBRARY_WARNINGS
    -DARDUINO_USB_MODE=1
    -DARDUINO_OTA
    -DCORE_DEBUG_LEVEL=4
    ; WS send queue: backpressure keeps it near-empty; 16 is a safety cap.
    ; Large chunks (100 samples) trigger lwIP windowed TX — the efficient path.
    -DWS_MAX_QUEUED_MESSAGES=16
board_build.partitions = default_16MB.csv
platform_packages = 
    ; Use already-installed toolchains
    espressif/toolchain-xtensa-esp32s3@8.4.0+2021r2-patch5
    espressif/toolchain-riscv32-esp@8.4.0+2021r2-patch5
lib_deps = 
    bblanchon/ArduinoJson@^7.2.2
    ; AsyncTCP-esphome: fixes lwip crash on abnormal connection close (refresh/abort)
    esphome/AsyncTCP-esphome@^2.1.3
    me-no-dev/ESPAsyncWebServer@^3.2.3
